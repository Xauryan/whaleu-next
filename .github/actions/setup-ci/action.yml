name: Set up pinned CI dependencies
description: Restore npm downloads and install the exact workspace lockfile
runs:
  using: composite
  steps:
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: 24.19.0
        cache: npm
        cache-dependency-path: package-lock.json
    - name: Install pinned package manager
      shell: bash
      run: npm install --global npm@11.9.0 --ignore-scripts --no-audit --no-fund
    - name: Verify package manager
      shell: bash
      run: test "$(npm --version)" = "11.9.0"
    - name: Install locked workspace dependencies
      shell: bash
      run: npm ci --ignore-scripts --no-audit --no-fund
