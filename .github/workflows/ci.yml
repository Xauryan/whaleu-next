name: Verify foundation

on:
  push:
    branches: [main, 'rewrite/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Verify CI inventory and guards
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Verify exact inventory, runner, artifact and workflow guards
        run: node --test scripts/run-integration-shard.test.mjs scripts/run-integration-module.test.mjs scripts/ci-native-artifact.test.mjs scripts/ci-workflow.test.mjs
      - name: Log complete integration module inventory
        run: node scripts/run-integration-module.mjs --verify
      - name: Generate the complete module matrix
        id: matrix
        run: echo "matrix=$(node scripts/run-integration-module.mjs --matrix)" >> "$GITHUB_OUTPUT"

  foundation:
    name: Repository quality
    env:
      WHALEU_TEST_MAINTENANCE: controlled
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - run: npm run account-policy:inventory:check
      - run: npm run lint
      - run: npm run format:check
      - run: npm run stats:test
      - run: npm run search:eval:test
      - name: Verify disposable database admission guards
        run: node --test scripts/verify-test-postgres.test.mjs

  api-checks:
    name: API types, contracts and build
    env:
      WHALEU_TEST_MAINTENANCE: controlled
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - run: npm run typecheck -w @whaleu/api
      - run: npm run openapi:check
      - run: npm run test -w @whaleu/api
      - run: npm run build -w @whaleu/api

  native-checks:
    name: Native types, contracts and build
    env:
      WHALEU_TEST_MAINTENANCE: controlled
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-attempt: ${{ steps.provenance.outputs.attempt }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - run: npm run typecheck -w @whaleu/wechat
      - run: npm run test -w @whaleu/wechat
      - name: Build native artifacts and run emitted smoke checks once
        run: npm run build -w @whaleu/wechat
      - name: Stage only native output with exact build provenance
        id: provenance
        run: |
          node scripts/ci-native-artifact.mjs create "$RUNNER_TEMP/native-artifact"
          echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Upload immutable same-run native artifact
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-dist-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-artifact
          if-no-files-found: error
          retention-days: 1
          compression-level: 1

  main-integration:
    name: PostgreSQL · ${{ matrix.label }} (${{ matrix.shard }})
    needs: [plan, native-checks]
    # Temporary browser-only compatibility runner; migrate before 2027-03-01.
    # Ubuntu22 image retires 2027-04-17. All other shards stay Ubuntu24.
    runs-on: ${{ matrix.module == 'official-account-browser' && 'ubuntu-22.04' || 'ubuntu-24.04' }}
    timeout-minutes: 150
    strategy:
      # Collect every shard's result even when another fails.
      fail-fast: false
      # Eight standard runners; never parallelize destructive files in one DB.
      max-parallel: 8
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      MAIN_PG_CONTAINER: whaleu-main-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.id }}
      WHALEU_TEST_MAINTENANCE: controlled
      CI_MODULE: ${{ matrix.module }}
      CI_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - name: Cache pinned official-operator Chromium only
        if: matrix.module == 'official-account-browser'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: official-operator-ubuntu22-userns-v1-${{ runner.os }}-${{ runner.arch }}-playwright-core-1.58.2-${{ hashFiles('package-lock.json') }}
      - name: Install pinned official-operator browser and system dependencies
        if: matrix.module == 'official-account-browser'
        run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Verify official-operator browser version and binary digest
        if: matrix.module == 'official-account-browser'
        run: node scripts/verify-official-browser.mjs
        env:
          WHALEU_OFFICIAL_BROWSER_SANDBOX: ubuntu22-userns-v1
      - name: Build emitted rating-promotion operator assets
        if: matrix.module == 'rating-group-promotion' || matrix.module == 'official-account-browser'
        run: node --max-old-space-size=3072 node_modules/typescript/bin/tsc -p apps/api/tsconfig.build.json
      - name: Verify shard manifest before database creation
        run: node scripts/run-integration-module.mjs --module "$CI_MODULE" --shard "$CI_SHARD" --list
      - name: Download only the successful native build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.native-checks.outputs.artifact-id }}
          path: ${{ runner.temp }}/native-artifact
          merge-multiple: true
      - name: Verify source, run, build attempt, lockfile and every native byte
        run: node scripts/ci-native-artifact.mjs restore "$RUNNER_TEMP/native-artifact"
        env:
          # A failed-job retry may reuse its successful producer's immutable ID.
          WHALEU_ARTIFACT_ATTEMPT: ${{ needs.native-checks.outputs.artifact-attempt }}
      - name: Start fresh controlled-maintenance PostgreSQL
        shell: bash
        run: |
          [[ "$WHALEU_TEST_MAINTENANCE" == controlled ]]
          docker run --detach --name "$MAIN_PG_CONTAINER" \
            --network host --shm-size=256m \
            --env POSTGRES_USER=whaleu_test \
            --env POSTGRES_PASSWORD=local_ci_only \
            --env POSTGRES_DB=whaleu_test \
            --health-cmd 'pg_isready -h 127.0.0.1 -p 5432 -U whaleu_test -d whaleu_test' \
            --health-interval 5s --health-timeout 3s --health-retries 10 \
            postgres:18.6-bookworm \
            postgres -c listen_addresses=127.0.0.1 -p 5432 -c autovacuum=off
          for attempt in {1..30}; do
            status=$(docker inspect --format '{{.State.Health.Status}}' "$MAIN_PG_CONTAINER")
            if [[ "$status" == healthy ]]; then exit 0; fi
            if [[ "$status" == unhealthy ]]; then break; fi
            sleep 2
          done
          docker logs "$MAIN_PG_CONTAINER"
          exit 1
      - name: Verify fresh controlled-maintenance service
        run: node scripts/verify-test-postgres.mjs
        env:
          NODE_ENV: test
          TEST_DATABASE_URL: postgresql://whaleu_test:local_ci_only@127.0.0.1:5432/whaleu_test
      - name: Real PostgreSQL integration tests
        run: |
          if [[ "$CI_MODULE" == official-account-browser ]]; then
            export WHALEU_OFFICIAL_BROWSER_SANDBOX=ubuntu22-userns-v1
            # Bound test hooks and leaked handles as well as the 540s of body deadlines.
            # Preserve failure and let GNU timeout terminate only its own process group.
            timeout --verbose --kill-after=10s 900s node scripts/run-integration-module.mjs --module "$CI_MODULE" --shard "$CI_SHARD"
          else
            timeout 7200 node scripts/run-integration-module.mjs --module "$CI_MODULE" --shard "$CI_SHARD"
          fi
        env:
          NODE_ENV: test
          WHALEU_RATINGS_CI_DIAGNOSTICS: '1'
          WHALEU_SCALABLE_PROFILE_CI_DIAGNOSTICS: '1'
          TEST_DATABASE_URL: postgresql://whaleu_test:local_ci_only@127.0.0.1:5432/whaleu_test
      - name: Show disposable database diagnostics on failure
        if: failure()
        run: docker logs "$MAIN_PG_CONTAINER"
      - name: Remove disposable database container
        if: always()
        run: |
          if docker inspect "$MAIN_PG_CONTAINER" >/dev/null 2>&1; then
            docker rm --force --volumes "$MAIN_PG_CONTAINER"
          fi

  semantic-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SEMANTIC_PG_CONTAINER: whaleu-semantic-${{ github.run_id }}-${{ github.run_attempt }}
      WHALEU_TEST_MAINTENANCE: controlled
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - name: Start isolated PostgreSQL with optional pgvector
        shell: bash
        run: |
          # Host networking preserves inet_server_addr()=127.0.0.1 for the
          # installer's disposable-loopback guard; bind PostgreSQL only there.
          [[ "$WHALEU_TEST_MAINTENANCE" == controlled ]]
          docker run --detach --name "$SEMANTIC_PG_CONTAINER" \
            --network host --shm-size=256m \
            --env POSTGRES_USER=whaleu_test \
            --env POSTGRES_PASSWORD=local_ci_only \
            --env POSTGRES_DB=whaleu_test \
            --health-cmd 'pg_isready -h 127.0.0.1 -p 55433 -U whaleu_test -d whaleu_test' \
            --health-interval 5s --health-timeout 3s --health-retries 10 \
            pgvector/pgvector:0.8.7-pg18-bookworm@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11 \
            postgres -c listen_addresses=127.0.0.1 -p 55433 -c autovacuum=off
          for attempt in {1..30}; do
            status=$(docker inspect --format '{{.State.Health.Status}}' "$SEMANTIC_PG_CONTAINER")
            if [[ "$status" == healthy ]]; then
              exit 0
            fi
            if [[ "$status" == unhealthy ]]; then
              break
            fi
            sleep 2
          done
          docker logs "$SEMANTIC_PG_CONTAINER"
          exit 1
      - name: Verify fresh controlled-maintenance service
        run: node scripts/verify-test-postgres.mjs
        env:
          NODE_ENV: test
          TEST_DATABASE_URL: postgresql://whaleu_test:local_ci_only@127.0.0.1:55433/whaleu_test
      - name: Verify pinned PostgreSQL and optional extension namespace
        shell: bash
        run: |
          # Roll back this probe so the suite exercises its own explicit installer.
          docker exec --interactive --env PGPASSWORD=local_ci_only "$SEMANTIC_PG_CONTAINER" \
            psql -X -h 127.0.0.1 -p 55433 -U whaleu_test -d whaleu_test --set ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          DO $$ BEGIN
            IF current_setting('server_version_num')::integer <> 180006 THEN
              RAISE EXCEPTION 'Expected PostgreSQL 18.6';
            END IF;
            IF inet_server_addr() <> inet '127.0.0.1' THEN
              RAISE EXCEPTION 'Expected disposable loopback PostgreSQL';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_available_extensions WHERE name='vector' AND default_version='0.8.7') THEN
              RAISE EXCEPTION 'Expected available pgvector 0.8.7';
            END IF;
            IF EXISTS (SELECT 1 FROM pg_extension WHERE extname='vector') THEN
              RAISE EXCEPTION 'Optional extension must not be preinstalled';
            END IF;
          END $$;
          CREATE EXTENSION vector WITH SCHEMA public VERSION '0.8.7';
          DO $$ BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_extension e JOIN pg_namespace n ON n.oid=e.extnamespace
              WHERE e.extname='vector' AND e.extversion='0.8.7' AND n.nspname='public') THEN
              RAISE EXCEPTION 'Expected pgvector 0.8.7 in public';
            END IF;
          END $$;
          ROLLBACK;
          SQL
      - name: Optional semantic PostgreSQL integration tests
        run: npm run test:semantic:integration -w @whaleu/api
        env:
          NODE_ENV: test
          TEST_DATABASE_URL: postgresql://whaleu_test:local_ci_only@127.0.0.1:55433/whaleu_test
      - name: Show optional database diagnostics on failure
        if: failure()
        run: docker logs "$SEMANTIC_PG_CONTAINER"
      - name: Remove optional database container
        if: always()
        run: |
          if docker inspect "$SEMANTIC_PG_CONTAINER" >/dev/null 2>&1; then
            docker rm --force --volumes "$SEMANTIC_PG_CONTAINER"
          fi

  verify:
    # Keep the existing required-check name; skipped/cancelled jobs are failures.
    if: always()
    needs:
      [
        plan,
        foundation,
        api-checks,
        native-checks,
        main-integration,
        semantic-integration,
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every verification job to succeed
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          FOUNDATION_RESULT: ${{ needs.foundation.result }}
          API_RESULT: ${{ needs.api-checks.result }}
          NATIVE_RESULT: ${{ needs.native-checks.result }}
          MAIN_RESULT: ${{ needs.main-integration.result }}
          SEMANTIC_RESULT: ${{ needs.semantic-integration.result }}
        run: |
          test "$PLAN_RESULT" = success
          test "$FOUNDATION_RESULT" = success
          test "$API_RESULT" = success
          test "$NATIVE_RESULT" = success
          test "$MAIN_RESULT" = success
          test "$SEMANTIC_RESULT" = success
