name: Verify foundation

on:
  push:
    branches: [main, 'rewrite/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_USER: whaleu_test
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: whaleu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U whaleu_test -d whaleu_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.19.0
          cache: npm
      - name: Install pinned package manager
        run: npm install --global npm@11.9.0 --ignore-scripts --no-audit --no-fund
      - name: Verify package manager
        run: test "$(npm --version)" = "11.9.0"
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run format:check
      - name: Real PostgreSQL integration tests
        run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgresql://whaleu_test:local_ci_only@127.0.0.1:5432/whaleu_test
